[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "G", "TRY", "PIE"]
ignore = [
    "E501",   # Line too long - handled by formatter with 100 char limit
    "TRY003", # Avoid specifying long messages outside exception class
    "TRY300", # Consider moving return to else block - too strict
    "TRY301", # Abstract raise to inner function - too strict
    "TRY400", # Use logging.exception instead of logging.error (we use exception already)
]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Relaxed settings - can tighten over time
disallow_untyped_defs = false
warn_return_any = false
check_untyped_defs = false
# Disable problematic checks for now - tighten incrementally
disable_error_code = [
    "union-attr",     # Many None checks needed
    "arg-type",       # Type argument mismatches
    "return-value",   # Return type mismatches
    "assignment",     # Assignment type mismatches
    "call-arg",       # Wrong keyword arguments
    "attr-defined",   # Missing attributes
    "call-overload",  # Overload resolution
    "index",          # Indexing issues
    "var-annotated",  # Missing annotations
]
