# Checks: automatic on every push to main. On pull requests the run is created
# but waits (using no runner minutes) at the `approve` job until a required
# reviewer approves it in the `approval` environment; approve from the PR's
# checks list or the run page. Manual dispatch runs the checks directly.
name: Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: approval
    steps:
      - run: echo "Checks approved by ${GITHUB_TRIGGERING_ACTOR}"

  build:
    needs: approve
    # Runs when approve passed or was skipped (push/dispatch); a rejected approval stops it.
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black ruff mypy bandit pip-audit

      - name: Run pytest
        run: |
          pytest -q --cov=src/services --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Format check with Black
        run: |
          black --version
          black --check --diff src tests

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with mypy (non-blocking)
        run: |
          mypy src
        continue-on-error: true

      - name: Bandit security scan
        run: |
          bandit -r src -x tests/

      - name: Dependency audit with pip-audit (non-blocking)
        run: |
          pip-audit
        continue-on-error: true
